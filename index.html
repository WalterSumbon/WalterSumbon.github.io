<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/assets/avatar-icon.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="夏寒的博客与网页小游戏。" />
    <title>Sumbon · 文章与游戏</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/vendor/highlight/github.min.css" />
    <script src="/vendor/yaml.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/vendor/highlight/highlight.min.js"></script>
    <script src="/vendor/matter.min.js"></script>
    <script src="/vendor/supabase.js"></script>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到正文</a>
    <header class="site-header">
      <a class="wordmark" href="#/">Sumbon<span class="mark">.</span></a>
      <nav aria-label="主导航">
        <a href="#/blog">文章</a><a href="#/collections">文章集</a
        ><a href="#/games">游戏室</a><a href="#/rankings">排行榜</a>
      </nav>
      <button id="search-toggle" class="quiet" aria-label="搜索文章">
        搜索 <kbd>⌘ K</kbd>
      </button>
      <div id="account" class="account" aria-live="polite"></div>
    </header>
    <main id="main" tabindex="-1">
      <p class="loading">正在读取文章与游戏目录…</p>
    </main>
    <footer class="site-footer">
      <span>夏寒 / Sumbon</span><span>文字、代码，和一些好玩的东西。</span
      ><a href="https://github.com/WalterSumbon" target="_blank" rel="noopener"
        >GitHub ↗</a
      >
    </footer>
    <dialog id="search-dialog">
      <form method="dialog">
        <button class="quiet close" aria-label="关闭搜索">关闭 ×</button>
      </form>
      <label for="search-input">搜索文章正文、标题或标签</label
      ><input
        id="search-input"
        type="search"
        placeholder="输入关键词，例如：分馏塔"
        autocomplete="off"
      />
      <div id="search-results" aria-live="polite"></div>
    </dialog>
    <noscript
      >本网站在浏览器内渲染 Markdown，请启用 JavaScript。原文可在 GitHub 仓库
      content/posts 目录阅读。</noscript
    >
  </body>
</html>
