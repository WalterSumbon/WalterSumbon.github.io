<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="/assets/avatar-icon.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="夏寒的博客与网页小游戏。" />
    <title>ZenithX · 文章与游戏</title>
    <script src="/src/theme.js"></script>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/vendor/highlight/github.min.css" />
    <script src="/vendor/yaml.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/vendor/katex/katex.min.js"></script>
    <script src="/vendor/highlight/highlight.min.js"></script>
    <script src="/vendor/matter.min.js"></script>
    <script src="/vendor/supabase.js"></script>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到正文</a>
    <header class="site-header">
      <a class="wordmark" href="#/" aria-label="夏寒 / ZenithX 首页"
        ><img
          src="/assets/avatar.svg"
          width="56"
          height="56"
          alt="ZenithX 像素头像"
      /></a>
      <nav aria-label="主导航">
        <a href="#/blog">文章</a><a href="#/collections">文章集</a
        ><a href="#/games">游戏室</a><a href="#/rankings">排行榜</a>
      </nav>
      <button id="search-toggle" class="quiet" aria-label="搜索文章">
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" stroke-linecap="round" /></svg
        ><span>搜索</span>
      </button>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        role="switch"
        aria-label="夜间模式"
        aria-checked="false"
      >
        <svg viewBox="0 0 92 44" aria-hidden="true">
          <defs>
            <clipPath id="theme-clip">
              <rect width="92" height="44" rx="22" />
            </clipPath>
          </defs>
          <g clip-path="url(#theme-clip)">
            <rect class="theme-sky" width="92" height="44" />
            <g class="theme-clouds" fill="#f1f7f8">
              <path
                opacity=".5"
                d="M24 44q-4-13 10-15q2-15 15-12q9-10 20-3q11-10 23-4v34Z"
              />
              <path d="M37 44q0-10 12-9q0-13 14-11q8-10 17-1q9-7 16-4v25Z" />
            </g>
            <g class="theme-stars" fill="#fff">
              <path
                d="m17 10 1 3 3 1-3 1-1 3-1-3-3-1 3-1Zm20 12 1.5 4 3.5 1-3.5 1-1.5 4-1-4-4-1 4-1Z"
              />
              <circle cx="30" cy="8" r="1" />
              <circle cx="12" cy="32" r="1" />
              <circle cx="47" cy="11" r="1" />
            </g>
            <g class="theme-orb">
              <circle
                class="theme-halo"
                cx="22"
                cy="22"
                r="29"
                fill="#fff"
                opacity=".12"
              />
              <circle class="theme-disc" cx="22" cy="22" r="17" />
              <g class="theme-craters" fill="#a5aabc">
                <circle cx="17" cy="17" r="4" />
                <circle cx="28" cy="28" r="5" />
                <circle cx="15" cy="29" r="2.5" />
              </g>
            </g>
          </g>
          <rect
            x="1"
            y="1"
            width="90"
            height="42"
            rx="21"
            fill="none"
            stroke="#ffffff30"
            stroke-width="2"
          />
        </svg>
      </button>
      <div id="account" class="account" aria-live="polite"></div>
    </header>
    <main id="main" tabindex="-1">
      <p class="loading">正在读取文章与游戏目录…</p>
    </main>
    <footer class="site-footer">
      <span>夏寒 / ZenithX</span
      ><a href="https://github.com/WalterSumbon" target="_blank" rel="noopener"
        >GitHub ↗</a
      >
    </footer>
    <dialog id="search-dialog">
      <form method="dialog">
        <button class="quiet close" aria-label="关闭搜索">关闭 ×</button>
      </form>
      <label for="search-input">搜索文章正文、标题或标签</label
      ><input
        id="search-input"
        type="search"
        placeholder="输入关键词，例如：分馏塔"
        autocomplete="off"
      />
      <div id="search-results" aria-live="polite"></div>
    </dialog>
    <noscript
      >本网站在浏览器内渲染 Markdown，请启用 JavaScript。原文可在 GitHub 仓库
      content/posts 目录阅读。</noscript
    >
  </body>
</html>
