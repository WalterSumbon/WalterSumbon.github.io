<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>纸翼预览</title
  ><style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #eaf0e6;
      cursor: pointer;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .bird {
      transform-origin: 180px 132px;
      transition: transform 0.25s ease;
    }
    body:hover .bird {
      transform: translateY(-14px) rotate(-5deg);
    }
    @media (prefers-reduced-motion: reduce) {
      .bird {
        transition: none;
      }
    }
  </style>
  <body>
    <svg viewBox="0 0 480 290" role="img" aria-label="纸翼穿过障碍">
      <defs>
        <linearGradient id="cover-sky" x2="0" y2="1">
          <stop stop-color="#94c5d4" />
          <stop offset="1" stop-color="#e6edd8" />
        </linearGradient>
      </defs>
      <rect width="480" height="290" fill="url(#cover-sky)" />
      <circle cx="400" cy="72" r="35" fill="#fff1ba" />
      <path d="M0 208Q90 135 180 205T480 180V290H0Z" fill="#a3c4aa" />
      <path d="M0 255Q110 183 220 249T480 225V290H0Z" fill="#7fa68f" />
      <path
        d="M326 0H376V80H326ZM326 215H376V290H326Z"
        fill="#497c68"
        stroke="#536f56"
        stroke-width="1.5"
      />
      <path
        d="M90 154Q139 105 180 132"
        fill="none"
        stroke="#879b84"
        stroke-dasharray="3 7"
      />
      <g class="bird">
        <g transform="translate(180 132) scale(2)">
          <path
            d="M-16 0Q-14 -13 -2 -13Q10 -13 12 -3L20 1L11 5Q3 15 -9 10Z"
            fill="#e6a652"
            stroke="#825e38"
            stroke-width="1.5"
          />
          <path d="M-12 -2L3 1L-9 8Z" fill="#fff0cc" />
          <circle cx="6" cy="-7" r="2" fill="#29332e" />
        </g>
      </g>
      <text
        x="24"
        y="264"
        font-family="monospace"
        font-size="11"
        letter-spacing="2"
        fill="#60765e"
      >
        01 / PAPER FLIGHT
      </text>
    </svg>
    <script>
      document.body.onclick = () =>
        parent.postMessage({ type: "open-game", id: "G001" }, location.origin);
    </script>
  </body>
</html>
